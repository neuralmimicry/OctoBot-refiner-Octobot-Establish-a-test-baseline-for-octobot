name: OctoBot-CI
on:
  push:
    branches:
      - 'master'
      - 'dev'
    tags:
      - '*'
  pull_request:

permissions: read-all

env:
  # actions/setup-python on self-hosted runners installs a shared-library CPython and
  # exports LD_LIBRARY_PATH; Pants scrubs it from sandboxed processes unless passed through.
  PANTS_SUBPROCESS_ENVIRONMENT_ENV_VARS: "+['LD_LIBRARY_PATH']"

jobs:
  overlay:
    name: NeuralMimicry overlay self-test (pinned upstream, idempotency)
    runs-on: [self-hosted, Linux, X64]
    steps:
      # The self-hosted runner has a global post-checkout LFS hook. Install
      # the pinned binary before checkout so sparse checkouts can run that hook.
      - name: Set up checksum-pinned Git LFS
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/git-lfs-linux-amd64-v3.8.0.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/git-lfs/git-lfs/releases/download/v3.8.0/git-lfs-linux-amd64-v3.8.0.tar.gz \
            --output "$archive"
          echo "e455e00f15d9b95661b8d53498ffb0c3367962cf1ec73c31ab7369516cd6ab8d  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/git-lfs"
          tar -xzf "$archive" -C "$RUNNER_TEMP/git-lfs"
          git_lfs_bin="$(find "$RUNNER_TEMP/git-lfs" -type f -name git-lfs -perm -111 -print -quit)"
          test -n "$git_lfs_bin"
          dirname "$git_lfs_bin" >> "$GITHUB_PATH"
          "$git_lfs_bin" version

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            neuralmimicry
            octobot
      - name: Apply overlay to a fresh upstream checkout twice
        run: |
          neuralmimicry/verify-upstream-release.sh
          neuralmimicry/octobot-overlay/selftest.sh

  build:
    needs: [ overlay ]
    name: ${{ matrix.os }}${{ matrix.arch }} - Python ${{ matrix.version }} - Build wheel
    runs-on: [self-hosted, Linux, X64]
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        arch: [ x64 ]
        version: [ "3.13.x" ]
    steps:
      - name: Set up checksum-pinned Git LFS
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/git-lfs-linux-amd64-v3.8.0.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/git-lfs/git-lfs/releases/download/v3.8.0/git-lfs-linux-amd64-v3.8.0.tar.gz \
            --output "$archive"
          echo "e455e00f15d9b95661b8d53498ffb0c3367962cf1ec73c31ab7369516cd6ab8d  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/git-lfs"
          tar -xzf "$archive" -C "$RUNNER_TEMP/git-lfs"
          git_lfs_bin="$(find "$RUNNER_TEMP/git-lfs" -type f -name git-lfs -perm -111 -print -quit)"
          test -n "$git_lfs_bin"
          dirname "$git_lfs_bin" >> "$GITHUB_PATH"
          "$git_lfs_bin" version
      - uses: actions/checkout@v6

      - name: Apply NeuralMimicry overlay
        run: python3 neuralmimicry/octobot-overlay/apply.py --target .

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.version }}
          architecture: ${{ matrix.arch }}

      - name: Install Pants
        uses: pantsbuild/actions/init-pants@v11
        with:
          gha-cache-key: ${{ runner.os }}-pants-build
          named-caches-hash: ${{ hashFiles('pants.toml') }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install Rust toolchain
        if: hashFiles('packages/*/crates/*/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust lint & tests
        if: hashFiles('packages/*/crates/*/Cargo.toml') != ''
        run: |
          cargo clippy --workspace -- -D warnings
          cargo test --workspace

      - name: Install maturin
        if: hashFiles('packages/*/crates/*/pyproject.toml') != ''
        run: pip install maturin

      - name: Build wheels
        run: pants package :OctoBot $(pants list --filter-target-type=package_shell_command ::)

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: octobot-wheel
          path: dist/*.whl
          if-no-files-found: error

  tests:
    needs: [ build ]
    name: ${{ matrix.os }}${{ matrix.arch }} - Python ${{ matrix.version }} - ${{ matrix.package }}
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        arch: [ x64 ]
        version: [ "3.13.x" ]
        package:
          - octobot
          - packages/agents
          - packages/async_channel
          - packages/backtesting
          - packages/commons
          - packages/evaluators
          - packages/node
          - packages/flow
          - packages/copy
          - packages/protocol
          - packages/services
          - packages/sync
          - packages/tentacles_manager
          - packages/trading

    env:
      USES_TENTACLES: ${{ matrix.package == 'octobot' || matrix.package == 'packages/node' || matrix.package == 'packages/flow' || matrix.package == 'packages/copy' }}

    steps:
    - name: Set up checksum-pinned Git LFS
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/git-lfs-linux-amd64-v3.8.0.tar.gz"
        curl --fail --location --retry 3 \
          https://github.com/git-lfs/git-lfs/releases/download/v3.8.0/git-lfs-linux-amd64-v3.8.0.tar.gz \
          --output "$archive"
        echo "e455e00f15d9b95661b8d53498ffb0c3367962cf1ec73c31ab7369516cd6ab8d  $archive" | sha256sum --check
        mkdir -p "$RUNNER_TEMP/git-lfs"
        tar -xzf "$archive" -C "$RUNNER_TEMP/git-lfs"
        git_lfs_bin="$(find "$RUNNER_TEMP/git-lfs" -type f -name git-lfs -perm -111 -print -quit)"
        test -n "$git_lfs_bin"
        echo "$(dirname "$git_lfs_bin")" >> "$GITHUB_PATH"
        "$git_lfs_bin" version

    - uses: actions/checkout@v6

    - name: Apply NeuralMimicry overlay
      run: python3 neuralmimicry/octobot-overlay/apply.py --target .

    - name: Detect package features
      id: detect
      run: |
        if ls ${{ matrix.package }}/crates/*/Cargo.toml 1>/dev/null 2>&1; then
          echo "has_rust=true" >> $GITHUB_OUTPUT
        else
          echo "has_rust=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up Python ${{ matrix.version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.version }}
        architecture: ${{ matrix.arch }}

    - name: Create isolated Python environment
      run: |
        octobot_venv="$(mktemp -d "$RUNNER_TEMP/octobot-ci-venv.XXXXXX")"
        python -m venv "$octobot_venv"
        echo "$octobot_venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$octobot_venv" >> "$GITHUB_ENV"
        echo "PIP_REQUIRE_VIRTUALENV=true" >> "$GITHUB_ENV"

    - name: Set up Node.js
      if: env.USES_TENTACLES == 'true'
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc

    - name: Download build wheel artifact
      uses: actions/download-artifact@v8
      with:
        name: octobot-wheel
        path: dist/

    - name: Install OctoBot
      run: |
        pip3 install -r dev_requirements.txt
        pip3 install dist/*.whl

    - name: Lint package
      run: |
        # pylint exit status is a bitmask: fail on fatal (1), error (2) or
        # usage error (32); tolerate warning (4), refactor (8), convention (16).
        rc=0
        if [ -f "${{ matrix.package }}/standard.rc" ]; then
          pylint --rcfile=${{ matrix.package }}/standard.rc ${{ matrix.package }}/ || rc=$?
        else
          pylint --rcfile=standard.rc ${{ matrix.package }}/ || rc=$?
        fi
        if (( rc & 35 )); then exit $rc; fi

    - name: Install Rust toolchain
      if: steps.detect.outputs.has_rust == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Lint Rust crates
      if: steps.detect.outputs.has_rust == 'true'
      run: |
        for crate in ${{ matrix.package }}/crates/*/; do
          cargo clippy --manifest-path "$crate/Cargo.toml" -- -D warnings
        done

    - name: Build web client SDK
      if: env.USES_TENTACLES == 'true'
      run: |
        npm ci
        npm run build -w packages/client/octobot_client_ts

    - name: Install tentacles
      if: env.USES_TENTACLES == 'true'
      env:
        ALLOW_UNSIGNED_TENTACLES: "true"
      run: |
        mkdir -p output
        OctoBot tentacles -d packages/tentacles -p any_platform.zip
        OctoBot tentacles --install --location output/any_platform.zip --all

    - name: Run tests
      run: |
        if [ "${{ matrix.package }}" = "octobot" ]; then
          pytest tests -n auto --dist loadfile -r ps
          pytest --ignore=tentacles/Trading/Exchange tentacles -n auto --dist loadfile -r ps
        else
          if [ "${{ matrix.package }}" = "packages/node" ] || [ "${{ matrix.package }}" = "packages/flow" ] || [ "${{ matrix.package }}" = "packages/copy" ]; then
            echo "Running tests from root dir to allow tentacles import"
            PYTHONPATH=.:$PYTHONPATH pytest ${{ matrix.package }}/tests -n auto --dist loadfile -r ps
          else
            cd ${{ matrix.package }}
            if [ "${{ matrix.package }}" = "packages/tentacles_manager" ]; then
              pytest tests -r ps
            else
              if [ "${{ matrix.package }}" = "packages/protocol" ]; then
                pytest test -r ps
              else
                pytest tests -n auto --dist loadfile -r ps
              fi
            fi
          fi
        fi
      env:
        DISABLE_SENTRY: True

    - name: Run Rust backend tests
      if: steps.detect.outputs.has_rust == 'true'
      run: |
        cd ${{ matrix.package }}
        pytest tests --backend=rust -v

    - name: Run frontend tests
      if: matrix.package == 'octobot'
      run: |
        find packages/tentacles -name "package.json" -not -path "*/node_modules/*" | while read pkg; do
          cd "$(dirname "$pkg")"
          npm test
          cd - > /dev/null
        done

  extended_linter:
    name: extended_linter
    needs: [ build ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.x"

      - name: Download build wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: octobot-wheel
          path: dist/

      - name: Install OctoBot
        run: |
          pip install -r dev_requirements.txt
          pip install dist/*.whl

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Build web client SDK
        run: |
          npm ci
          npm run build -w packages/client/octobot_client_ts

      - name: Install tentacles
        env:
          ALLOW_UNSIGNED_TENTACLES: "true"
        run: |
          mkdir -p output
          OctoBot tentacles -d packages/tentacles -p any_platform.zip
          OctoBot tentacles --install --location output/any_platform.zip --all

      - name: tools tests
        run: PYTHONPATH=.:$PYTHONPATH pytest tools/tests -q

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }}

      - name: PR policy check
        if: github.event_name == 'pull_request'
        id: linter
        run: |
          PYTHONPATH=. python -m tools.extended_linter \
            --base origin/${{ github.base_ref }} \
            --continue \
            --skip-tentacles-reinstall \
            --write-report-json extended-linter.json | tee extended-linter.txt

      - name: Upload extended_linter report on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: extended-linter-report
          path: |
            extended-linter.txt
            extended-linter.json

      - name: Step summary on failure
        if: failure() && github.event_name == 'pull_request'
        run: |
          echo "## extended_linter failed" >> "$GITHUB_STEP_SUMMARY"
          cat extended-linter.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  docker:
    name: Build and test container image (${{ matrix.arch }})
    needs: [ build, tests ]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      checks: write
      pull-requests: write
      packages: write
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            python_arch: x64
            platform: linux/amd64
            git_lfs_arch: amd64
            git_lfs_sha256: e455e00f15d9b95661b8d53498ffb0c3367962cf1ec73c31ab7369516cd6ab8d
            runner_labels: '["self-hosted", "Linux", "X64"]'
          - arch: arm64
            python_arch: arm64
            platform: linux/arm64
            git_lfs_arch: arm64
            git_lfs_sha256: ac9c8efac980bb0505ead384d087e2acb6486fd8498691a2165fa174ec6118c2
            runner_labels: '["self-hosted", "Linux", "ARM64"]'

    steps:
      - name: Set up checksum-pinned Git LFS
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/git-lfs-linux-${{ matrix.git_lfs_arch }}-v3.8.0.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/git-lfs/git-lfs/releases/download/v3.8.0/git-lfs-linux-${{ matrix.git_lfs_arch }}-v3.8.0.tar.gz" \
            --output "$archive"
          echo "${{ matrix.git_lfs_sha256 }}  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/git-lfs"
          tar -xzf "$archive" -C "$RUNNER_TEMP/git-lfs"
          git_lfs_bin="$(find "$RUNNER_TEMP/git-lfs" -type f -name git-lfs -perm -111 -print -quit)"
          test -n "$git_lfs_bin"
          dirname "$git_lfs_bin" >> "$GITHUB_PATH"
          "$git_lfs_bin" version

      - uses: actions/checkout@v6

      - name: Apply NeuralMimicry overlay
        run: python3 neuralmimicry/octobot-overlay/apply.py --target .

      - name: Prepare isolated native container storage and runtime
        run: neuralmimicry/ci-podman.sh --prepare

      - name: Verify Podman is available
        run: neuralmimicry/ci-podman.sh version

      - name: Verify native container architecture
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) host_arch=amd64 ;;
            aarch64|arm64) host_arch=arm64 ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          if [[ "${host_arch}" != "${{ matrix.arch }}" ]]; then
            echo "Runner architecture mismatch: expected ${{ matrix.arch }}, got ${host_arch}" >&2
            exit 1
          fi

      - name: Run hadolint
        if: matrix.arch == 'amd64'
        uses: reviewdog/action-hadolint@v1
        with:
          github_token: ${{ github.token }}
          hadolint_ignore: DL3013 DL3008

      - name: Set Environment Variables
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]' | tr -d '-')"
          IMG=octobot-refiner
          {
            echo "VERSION=$(sed -n 's/^release=//p' neuralmimicry/octobot-overlay/UPSTREAM)"
            echo "IMAGE=ghcr.io/${OWNER}/${IMG}"
            echo "ARCH=${{ matrix.arch }}"
            echo "PLATFORM=${{ matrix.platform }}"
            echo "LATEST=latest"
            echo "STAGING=staging"
            echo "STABLE=stable"
            echo "TEST=test"
            echo "SHA=${GITHUB_SHA}"
            echo "CONTAINER_NAME=octobot-${{ matrix.arch }}"
            echo "CHECK_TENTACLE_CONTAINER_TIME=10"
            echo "WAIT_CONTAINER_TIME=80"
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "TENTACLES_URL_TAG="
            elif [[ "${GITHUB_REF}" == "refs/heads/master" || "${GITHUB_REF}" == refs/tags/* ]]; then
              echo "TENTACLES_URL_TAG=stable"
            else
              echo "TENTACLES_URL_TAG=latest"
            fi
          } >> "${GITHUB_ENV}"

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.x"
          architecture: ${{ matrix.python_arch }}

      - name: Set up Node.js for tentacle packaging
        uses: actions/setup-node@v6
        with:
          node-version-file: packages/tentacles/Services/Interfaces/node_web_interface/.nvmrc

      - name: Create isolated Python environment
        run: |
          octobot_venv="$(mktemp -d "$RUNNER_TEMP/octobot-container-venv.XXXXXX")"
          python -m venv "$octobot_venv"
          echo "$octobot_venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$octobot_venv" >> "$GITHUB_ENV"
          echo "PIP_REQUIRE_VIRTUALENV=true" >> "$GITHUB_ENV"

      - name: Download build wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: octobot-wheel
          path: dist/

      - name: Install OctoBot & tentacles
        env:
          ALLOW_UNSIGNED_TENTACLES: "true"
        run: |
          pip3 install -r dev_requirements.txt
          pip3 install dist/octobot-*.whl
          mkdir -p output
          OctoBot tentacles -d packages/tentacles -p any_platform.zip
          OctoBot tentacles --install --location output/any_platform.zip --all

      - name: Validate and fingerprint source-matched tentacles
        run: |
          set -euo pipefail
          test -d tentacles/Trading/Mode/ai_trading_mode
          count="$(find tentacles -type f -name metadata.json | wc -l)"
          test "${count}" -ge 150
          printf '%s\n' "${count}" > tentacles/.swarmhpc-baked-count
          cat /proc/sys/kernel/random/uuid > tentacles/.swarmhpc-baked-id
          echo "Embedded ${count} source-matched tentacles"

      - name: Build OctoBot image
        run: >-
          "${CONTAINER_RUNTIME}" build --platform "${PLATFORM}" --tag "${IMAGE}:${SHA}-${ARCH}"
          --build-arg TENTACLES_URL_TAG="${TENTACLES_URL_TAG}"
          --build-arg VERSION="${VERSION}"
          --build-arg SOURCE_REVISION="${GITHUB_SHA}"
          --build-arg
          SOURCE_REPOSITORY="https://github.com/${GITHUB_REPOSITORY}" .

      - name: Build test container
        if: >-
          github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          "${CONTAINER_RUNTIME}" build --platform "${PLATFORM}" -f ./tests/Dockerfile \
            --build-arg OCTOBOT_IMAGE="${IMAGE}:${SHA}-${ARCH}" \
            --tag "${IMAGE}:${TEST}-${ARCH}" .

      - name: Run backtesting route acceptance tests
        if: >-
          github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          route_tests=tentacles/Services/Interfaces/web_interface/tests
          "${CONTAINER_RUNTIME}" run --rm -i \
            -e DISABLE_SENTRY=True \
            -e OCTOBOT_TEST_PATH="${route_tests}" \
            "${IMAGE}:${TEST}-${ARCH}"

      - name: Run container tests
        if: >-
          github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          "${CONTAINER_RUNTIME}" run --rm -i -e DISABLE_SENTRY=True "${IMAGE}:${TEST}-${ARCH}"

      - name: Start and check container health
        if: >-
          github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          set -euo pipefail
          runtime_tentacles="$(mktemp -d \
            "$RUNNER_TEMP/octobot-runtime-tentacles.XXXXXX")"
          runtime_user="$(mktemp -d \
            "$RUNNER_TEMP/octobot-runtime-user.XXXXXX")"
          cleanup() {
            "${CONTAINER_RUNTIME}" rm --force "${CONTAINER_NAME}" >/dev/null 2>&1 || true
            rm -rf "$runtime_tentacles" "$runtime_user"
          }
          trap cleanup EXIT
          # Match production's persisted profile volume with an isolated,
          # source-matched non-trading fixture. Do not fetch mutable profiles
          # or tentacles from the network during runtime acceptance.
          mkdir -p "$runtime_user/profiles/default"
          cp -R packages/tentacles/profiles/non-trading/. "$runtime_user/profiles/default/"
          printf '%s\n' '{"profile":"default","accepted_terms":true,"distribution":"default","exchanges":{},"services":{"web":{"auto-open-in-web-browser":false}},"notification":{}}' > "$runtime_user/config.json"
          # Match the production Ansible profile: default Node mode disables
          # the standalone browser interface that this health check verifies.
          # Isolated CI runtimes have no user-systemd socket for timer units.
          # Keep the health command and run it explicitly after startup below.
          "${CONTAINER_RUNTIME}" run --detach \
            --network none \
            --health-cmd 'curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5001/ >/dev/null' \
            --health-interval disable \
            --health-timeout 10s \
            --health-retries 5 \
            --volume "${runtime_tentacles}:/octobot/tentacles:Z" \
            --volume "${runtime_user}:/octobot/user:Z" \
            --env DISABLE_SENTRY=True \
            --env FORCE_OCTOBOT_STANDALONE=true \
            --env WEB_ADDRESS=0.0.0.0 \
            --name "${CONTAINER_NAME}" "${IMAGE}:${SHA}-${ARCH}"
          sleep "${WAIT_CONTAINER_TIME}"
          "${CONTAINER_RUNTIME}" logs "${CONTAINER_NAME}"
          container_status="$("${CONTAINER_RUNTIME}" inspect \
            --format '{{.State.Status}}' \
            "${CONTAINER_NAME}")"
          test "$container_status" = running
          if ! "${CONTAINER_RUNTIME}" healthcheck run "${CONTAINER_NAME}"; then
            echo "Container health check failed; bounded state and HTTP status follow."
            "${CONTAINER_RUNTIME}" inspect --format '{{json .State}}' "${CONTAINER_NAME}"
            "${CONTAINER_RUNTIME}" exec "${CONTAINER_NAME}" sh -c \
              'curl --silent --show-error --max-time 5 --output /dev/null --write-out "HTTP status %{http_code}\n" http://127.0.0.1:5001/ || true'
            exit 1
          fi
          test -s "${runtime_tentacles}/.swarmhpc-baked-id"
          "${CONTAINER_RUNTIME}" exec "${CONTAINER_NAME}" \
            curl --fail --silent --show-error --max-time 10 http://127.0.0.1:5001/api/version \
            | jq --exit-status --arg expected "OctoBot ${VERSION}" '. == $expected'
          test "$(cat "${runtime_tentacles}/.swarmhpc-baked-count")" -gt 0
          image_arch="$("${CONTAINER_RUNTIME}" image inspect --format '{{.Architecture}}' "${IMAGE}:${SHA}-${ARCH}")"
          test "${image_arch}" = "${ARCH}"

      - name: Push native architecture image
        if: github.event_name == 'push'
        env:
          REGISTRY_TOKEN: >-
            ${{ secrets.GHCR_BOOTSTRAP_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          auth_file="${RUNNER_TEMP}/octobot-registry-auth.json"
          trap 'rm -f "$auth_file"' EXIT
          test -n "$REGISTRY_TOKEN"
          printf '%s' "$REGISTRY_TOKEN" | "${CONTAINER_RUNTIME}" login \
            --authfile "$auth_file" --username "$GITHUB_ACTOR" \
            --password-stdin ghcr.io
          "${CONTAINER_RUNTIME}" push --authfile "$auth_file" \
            "${IMAGE}:${SHA}-${ARCH}" \
            "docker://${IMAGE}:sha-${SHA}-${ARCH}"

      - name: Remove only this job's private container store
        if: always() && env.CONDUCTOR_PODMAN_ROOT != ''
        run: neuralmimicry/ci-podman.sh --cleanup

  publish:
    name: Publish immutable multi-architecture image
    needs: [ docker ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    runs-on: [ self-hosted, Linux, X64 ]
    steps:
      - name: Download only the container runtime wrapper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p neuralmimicry
          gh api "repos/${GITHUB_REPOSITORY}/contents/neuralmimicry/ci-podman.sh?ref=${GITHUB_SHA}" \
            --jq .content | base64 --decode > neuralmimicry/ci-podman.sh
          chmod 700 neuralmimicry/ci-podman.sh

      - name: Install and verify Podman publishing tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v podman >/dev/null 2>&1 \
            || ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman skopeo
          fi
          echo "/usr/bin" >> "${GITHUB_PATH}"
          export PATH="/usr/bin:/bin:${PATH}"
          skopeo --version

      - name: Prepare isolated image index publication
        run: neuralmimicry/ci-podman.sh --prepare

      - name: Set image references
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]' | tr -d '-')"
          image_name=octobot-refiner
          {
            echo "IMAGE=ghcr.io/${owner}/${image_name}"
            echo "VERSION=${GITHUB_REF##*/}"
            echo "SHA=${GITHUB_SHA}"
          } >> "${GITHUB_ENV}"

      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: >-
            ${{ secrets.GHCR_BOOTSTRAP_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          auth_file="${RUNNER_TEMP}/octobot-registry-auth.json"
          test -n "${REGISTRY_TOKEN}"
          printf '%s' "${REGISTRY_TOKEN}" | "${CONTAINER_RUNTIME}" login \
            --authfile "${auth_file}" --username "${GITHUB_ACTOR}" \
            --password-stdin ghcr.io
          echo "REGISTRY_AUTH_FILE=${auth_file}" >> "${GITHUB_ENV}"

      - name: Assemble and publish exact-source image index
        shell: bash
        run: |
          set -euo pipefail
          manifest="${IMAGE}:sha-${SHA}"
          digest_file="${RUNNER_TEMP}/octobot-image.digest"
          raw_manifest="${RUNNER_TEMP}/octobot-image-manifest.json"
          image_reference="${RUNNER_TEMP}/octobot-image-reference.txt"
          auth_file="${REGISTRY_AUTH_FILE}"
          trap 'rm -f "$auth_file"' EXIT

          "${CONTAINER_RUNTIME}" manifest rm "${manifest}" >/dev/null 2>&1 || true
          "${CONTAINER_RUNTIME}" manifest create "${manifest}"
          "${CONTAINER_RUNTIME}" manifest add "${manifest}" "docker://${IMAGE}:sha-${SHA}-amd64"
          "${CONTAINER_RUNTIME}" manifest add "${manifest}" "docker://${IMAGE}:sha-${SHA}-arm64"
          "${CONTAINER_RUNTIME}" manifest push --all --authfile "${auth_file}" \
            --digestfile "${digest_file}" "${manifest}" "docker://${manifest}"

          tags=()
          if [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            tags+=(latest)
          elif [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            tags+=(staging)
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags+=(latest stable "${VERSION}")
          fi
          for tag in "${tags[@]}"; do
            "${CONTAINER_RUNTIME}" manifest push --all --authfile "${auth_file}" \
              "${manifest}" "docker://${IMAGE}:${tag}"
          done

          digest="$(cat "${digest_file}")"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          skopeo inspect --raw --authfile "${auth_file}" \
            "docker://${IMAGE}:sha-${SHA}" > "${raw_manifest}"
          jq -e '
            [.manifests[]?.platform
              | select(
                  .os == "linux"
                  and (.architecture == "amd64" or .architecture == "arm64")
                )
              | .architecture]
            | unique == ["amd64", "arm64"]
          ' "${raw_manifest}" >/dev/null
          registry_digest="sha256:$(sha256sum "${raw_manifest}" | awk '{print $1}')"
          test "${registry_digest}" = "${digest}"
          printf '%s@%s\n' "${IMAGE}" "${digest}" > "${image_reference}"
          printf 'Runner-built multi-architecture image: %s\n' \
            "$(cat "${image_reference}")" >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain immutable image reference
        uses: actions/upload-artifact@v7
        with:
          name: octobot-image-reference-${{ github.sha }}
          path: ${{ runner.temp }}/octobot-image-reference.txt
          if-no-files-found: error

      - name: Remove temporary registry credentials
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/octobot-registry-auth.json"

      - name: Remove only this job's private container store
        if: always() && env.CONDUCTOR_PODMAN_ROOT != ''
        run: neuralmimicry/ci-podman.sh --cleanup

  tentacles:
    needs: [ build, tests, publish-npm ]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
    name: ${{ matrix.os }}${{ matrix.arch }} - Python ${{ matrix.version }} - Upload Tentacles
    runs-on: [self-hosted, Linux, X64]
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        arch: [ x64 ]
        version: [ "3.13.x" ]

    steps:
      - name: Set up checksum-pinned Git LFS
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/git-lfs-linux-amd64-v3.8.0.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/git-lfs/git-lfs/releases/download/v3.8.0/git-lfs-linux-amd64-v3.8.0.tar.gz \
            --output "$archive"
          echo "e455e00f15d9b95661b8d53498ffb0c3367962cf1ec73c31ab7369516cd6ab8d  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/git-lfs"
          tar -xzf "$archive" -C "$RUNNER_TEMP/git-lfs"
          git_lfs_bin="$(find "$RUNNER_TEMP/git-lfs" -type f -name git-lfs -perm -111 -print -quit)"
          test -n "$git_lfs_bin"
          echo "$(dirname "$git_lfs_bin")" >> "$GITHUB_PATH"
          "$git_lfs_bin" version

      - uses: actions/checkout@v6

      - name: Apply NeuralMimicry overlay
        run: python3 neuralmimicry/octobot-overlay/apply.py --target .

      - name: Set up Python ${{ matrix.version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.version }}
          architecture: ${{ matrix.arch }}

      - name: Download build wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: octobot-wheel
          path: dist/

      - name: Install OctoBot
        run: |
          pip3 install -r dev_requirements.txt
          pip3 install dist/octobot-*.whl

      - name: Prepare tentacles package
        run: |
          mkdir -p ../new_tentacles
          cp -r packages/tentacles/Agent packages/tentacles/Automation packages/tentacles/Backtesting packages/tentacles/Evaluator packages/tentacles/Meta packages/tentacles/Services packages/tentacles/Trading packages/tentacles/profiles ../new_tentacles/

      - name: Publish tag tentacles
        if: startsWith(github.ref, 'refs/tags')
        env:
          S3_API_KEY: ${{ secrets.S3_API_KEY }}
          S3_API_SECRET_KEY: ${{ secrets.S3_API_SECRET_KEY }}
          S3_REGION_NAME: ${{ secrets.S3_REGION_NAME }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          TENTACLES_SIGNING_PRIVATE_KEY: ${{ secrets.TENTACLES_SIGNING_PRIVATE_KEY }}
        run: |
          echo "Publishing tentacles for tag: ${GITHUB_REF_NAME}"
          cp packages/tentacles/metadata.yaml ../metadata.yaml
          sed -i "s/VERSION_PLACEHOLDER/${GITHUB_REF_NAME}/g" ../metadata.yaml
          OctoBot tentacles -m "../metadata.yaml" -d "../new_tentacles" -p "../any_platform.zip" -ite -ute ${{ secrets.TENTACLES_OFFICIAL_PATH }}/tentacles -upe ${{ secrets.TENTACLES_OFFICIAL_PATH }}/packages/full/${{ secrets.TENTACLES_REPOSITORY_NAME }}/
          python packages/tentacles/scripts/clear_cloudflare_cache.py ${GITHUB_REF_NAME}

      - name: Publish latest tentacles
        if: github.ref == 'refs/heads/dev' && startsWith(github.ref, 'refs/tags') != true
        env:
          S3_API_KEY: ${{ secrets.S3_API_KEY }}
          S3_API_SECRET_KEY: ${{ secrets.S3_API_SECRET_KEY }}
          S3_REGION_NAME: ${{ secrets.S3_REGION_NAME }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          TENTACLES_SIGNING_PRIVATE_KEY: ${{ secrets.TENTACLES_SIGNING_PRIVATE_KEY }}
        run: |
          cp packages/tentacles/metadata.yaml ../metadata.yaml
          sed -i "s/VERSION_PLACEHOLDER/latest/g" ../metadata.yaml
          OctoBot tentacles -m "../metadata.yaml" -d "../new_tentacles" -p "../any_platform.zip" -upe ${{ secrets.TENTACLES_OFFICIAL_PATH }}/packages/full/${{ secrets.TENTACLES_REPOSITORY_NAME }}/
          python packages/tentacles/scripts/clear_cloudflare_cache.py latest

      - name: Publish stable tentacles
        if: github.ref == 'refs/heads/master'
        env:
          S3_API_KEY: ${{ secrets.S3_API_KEY }}
          S3_API_SECRET_KEY: ${{ secrets.S3_API_SECRET_KEY }}
          S3_REGION_NAME: ${{ secrets.S3_REGION_NAME }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          TENTACLES_SIGNING_PRIVATE_KEY: ${{ secrets.TENTACLES_SIGNING_PRIVATE_KEY }}
        run: |
          cp packages/tentacles/metadata.yaml ../metadata.yaml
          sed -i "s/VERSION_PLACEHOLDER/stable/g" ../metadata.yaml
          OctoBot tentacles -m "../metadata.yaml" -d "../new_tentacles" -p "../any_platform.zip" -upe ${{ secrets.TENTACLES_OFFICIAL_PATH }}/packages/full/${{ secrets.TENTACLES_REPOSITORY_NAME }}/
          python packages/tentacles/scripts/clear_cloudflare_cache.py stable

  docs:
    name: Build & Deploy Docs
    if: github.repository == 'Drakkar-Software/OctoBot'
    needs: [build, tests]
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Set up checksum-pinned Git LFS
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/git-lfs-linux-amd64-v3.8.0.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/git-lfs/git-lfs/releases/download/v3.8.0/git-lfs-linux-amd64-v3.8.0.tar.gz \
            --output "$archive"
          echo "e455e00f15d9b95661b8d53498ffb0c3367962cf1ec73c31ab7369516cd6ab8d  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/git-lfs"
          tar -xzf "$archive" -C "$RUNNER_TEMP/git-lfs"
          git_lfs_bin="$(find "$RUNNER_TEMP/git-lfs" -type f -name git-lfs -perm -111 -print -quit)"
          test -n "$git_lfs_bin"
          echo "$(dirname "$git_lfs_bin")" >> "$GITHUB_PATH"
          "$git_lfs_bin" version

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Apply NeuralMimicry overlay
        run: python3 neuralmimicry/octobot-overlay/apply.py --target .

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: cd docs && npm ci

      - name: Test docs
        run: cd docs && npm test

      - name: Build docs
        run: cd docs && npm run build

      - name: Check Cloudflare preview credentials
        id: cloudflare-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare preview skipped: API token or account ID is not configured."
          fi

      - name: Upload version (preview URL)
        if: steps.cloudflare-preview.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: versions upload

      - name: Deploy to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: versions deploy --yes

  publish-npm:
    name: Publish npm packages
    needs: [ build, tests ]
    if: github.repository == 'Drakkar-Software/OctoBot' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/'))
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      id-token: write   # required for npm trusted publishing (OIDC, no token needed)

    steps:
      - name: Set up checksum-pinned Git LFS
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/git-lfs-linux-amd64-v3.8.0.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/git-lfs/git-lfs/releases/download/v3.8.0/git-lfs-linux-amd64-v3.8.0.tar.gz \
            --output "$archive"
          echo "e455e00f15d9b95661b8d53498ffb0c3367962cf1ec73c31ab7369516cd6ab8d  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/git-lfs"
          tar -xzf "$archive" -C "$RUNNER_TEMP/git-lfs"
          git_lfs_bin="$(find "$RUNNER_TEMP/git-lfs" -type f -name git-lfs -perm -111 -print -quit)"
          test -n "$git_lfs_bin"
          echo "$(dirname "$git_lfs_bin")" >> "$GITHUB_PATH"
          "$git_lfs_bin" version

      - uses: actions/checkout@v6

      - name: Apply NeuralMimicry overlay
        run: python3 neuralmimicry/octobot-overlay/apply.py --target .

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (trusted publishing requires >= 11.5.1)
        run: npm install -g npm@latest

      - name: Publish octobot-protocol if version not already on npm
        working-directory: packages/protocol/octobot_protocol_ts
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published — nothing to do."
          else
            echo "Publishing $NAME@$VERSION..."
            npm publish --access public
          fi

      - name: Publish octobot-client if version not already on npm
        run: |
          npm ci
          npm run build -w packages/client/octobot_client_ts
          npm test -w packages/client/octobot_client_ts
          cd packages/client/octobot_client_ts
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published — nothing to do."
          else
            echo "Publishing $NAME@$VERSION..."
            npm publish --access public
          fi

  version:
    needs: [ build, tests ]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    name: Source distribution - Python ${{ matrix.version }} - Deploy
    runs-on: [self-hosted, Linux, X64]
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        arch: [ x64 ]
        version: [ "3.13.x" ]

    steps:
      - name: Set up checksum-pinned Git LFS
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/git-lfs-linux-amd64-v3.8.0.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/git-lfs/git-lfs/releases/download/v3.8.0/git-lfs-linux-amd64-v3.8.0.tar.gz \
            --output "$archive"
          echo "e455e00f15d9b95661b8d53498ffb0c3367962cf1ec73c31ab7369516cd6ab8d  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/git-lfs"
          tar -xzf "$archive" -C "$RUNNER_TEMP/git-lfs"
          git_lfs_bin="$(find "$RUNNER_TEMP/git-lfs" -type f -name git-lfs -perm -111 -print -quit)"
          test -n "$git_lfs_bin"
          echo "$(dirname "$git_lfs_bin")" >> "$GITHUB_PATH"
          "$git_lfs_bin" version

      - uses: actions/checkout@v6

      - name: Apply NeuralMimicry overlay
        run: python3 neuralmimicry/octobot-overlay/apply.py --target .

      - name: Set up Python ${{ matrix.version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.version }}
          architecture: ${{ matrix.arch }}

      - name: Download build wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: octobot-wheel
          path: dist/

      - name: Publish packages
        run: |
          pip install twine
          python -m twine upload --repository-url ${{ secrets.PYPI_OFFICIAL_UPLOAD_URL }} -u __token__ -p ${{ secrets.PYPI_TOKEN }} --skip-existing dist/*

  binary:
    needs: [ build, tests ]
    name: ${{ matrix.os }} - ${{ matrix.arch }} - binary
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            runs_on: '["self-hosted","Linux","X64"]'
          - os: macos-latest
            arch: arm64
            runs_on: '["macos-latest"]'
          - os: windows-latest
            arch: x64
            runs_on: '["windows-latest"]'

    steps:
    - name: Set up checksum-pinned Git LFS
      if: runner.os == 'Linux'
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/git-lfs-linux-amd64-v3.8.0.tar.gz"
        curl --fail --location --retry 3 \
          https://github.com/git-lfs/git-lfs/releases/download/v3.8.0/git-lfs-linux-amd64-v3.8.0.tar.gz \
          --output "$archive"
        echo "e455e00f15d9b95661b8d53498ffb0c3367962cf1ec73c31ab7369516cd6ab8d  $archive" | sha256sum --check
        mkdir -p "$RUNNER_TEMP/git-lfs"
        tar -xzf "$archive" -C "$RUNNER_TEMP/git-lfs"
        git_lfs_bin="$(find "$RUNNER_TEMP/git-lfs" -type f -name git-lfs -perm -111 -print -quit)"
        test -n "$git_lfs_bin"
        echo "$(dirname "$git_lfs_bin")" >> "$GITHUB_PATH"
        "$git_lfs_bin" version

    - uses: actions/checkout@v6

    - name: Download wheel artifact
      uses: actions/download-artifact@v8
      with:
        name: octobot-wheel
        path: dist/

    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13.x'
        architecture: x64

    - name: Build OctoBot Binary on Linux
      if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'
      env:
        OCTOBOT_REPOSITORY_DIR: OctoBot
        NLTK_DATA: nltk_data
        BUILD_ARCH: ${{ matrix.arch }}
      run: |
        python3 -m pip install -U pip setuptools wheel
        python3 -m pip install -r packages/binary/requirements.txt
        pip3 install dist/octobot-*.whl
        bash ./packages/binary/build_scripts/unix.sh

    - name: Build OctoBot Binary on MacOS
      if: matrix.os == 'macos-latest'
      env:
        OCTOBOT_REPOSITORY_DIR: OctoBot
        NLTK_DATA: nltk_data
        BUILD_ARCH: ${{ matrix.arch }}
      run: |
        python3 -m pip install -U pip setuptools wheel
        python3 -m pip install -r packages/binary/requirements.txt
        pip3 install dist/octobot-*.whl
        bash ./packages/binary/build_scripts/unix.sh

    - name: Build OctoBot Binary on Windows
      if: matrix.os == 'windows-latest'
      env:
        OCTOBOT_REPOSITORY_DIR: OctoBot
        NLTK_DATA: nltk_data
      run: |
        python -m pip install -U pip setuptools wheel
        python -m pip install -r packages\binary\requirements.txt
        python -m pip install (Get-Item dist/octobot-*.whl).FullName
        .\packages\binary\build_scripts\windows.ps1
      shell: powershell

    - name: Upload OctoBot Binary on MacOS
      uses: actions/upload-artifact@v7
      if: matrix.os == 'macos-latest'
      with:
        name: OctoBot_macos_${{ matrix.arch }}
        path: OctoBot_${{ matrix.arch }}
        if-no-files-found: error

    - name: Upload OctoBot Binary on Linux
      uses: actions/upload-artifact@v7
      if: matrix.os == 'ubuntu-latest'
      with:
        name: OctoBot_linux_${{ matrix.arch }}
        path: OctoBot_${{ matrix.arch }}
        if-no-files-found: error

    - name: Upload OctoBot Binary on Windows
      uses: actions/upload-artifact@v7
      if: matrix.os == 'windows-latest'
      with:
        name: OctoBot_windows_${{ matrix.arch }}.exe
        path: OctoBot_windows.exe
        if-no-files-found: error

  release:
    name: Create Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs: [ binary, docker, tentacles ]
    permissions:
      contents: write
    runs-on: [self-hosted, Linux, X64]
    strategy:
      matrix:
        os: [ ubuntu-latest ]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: OctoBot_*

      - name: Set version as environement var
        id: vars
        run: echo ::set-output name=tag::${GITHUB_REF#refs/*/}

      - name: Clean artifact names
        run: |
          mkdir bin
          mv OctoBot_linux_x64/OctoBot_x64 bin/OctoBot_linux_x64
          mv OctoBot_windows_x64.exe/OctoBot_windows.exe bin/OctoBot_windows_x64.exe
          mv OctoBot_linux_arm64/OctoBot_arm64 bin/OctoBot_linux_arm64
          mv OctoBot_macos_arm64/OctoBot_arm64 bin/OctoBot_macos_arm64

      - name: Compute hashes
        id: hashes
        run: |
          echo ::set-output name=octobot_linux_x64_hash::$(openssl sha256 ./bin/OctoBot_linux_x64 | awk '{print $2}')
          echo ::set-output name=octobot_linux_arm64_hash::$(openssl sha256 ./bin/OctoBot_linux_arm64 | awk '{print $2}')
          echo ::set-output name=octobot_macos_arm64_hash::$(openssl sha256 ./bin/OctoBot_macos_arm64 | awk '{print $2}')
          echo ::set-output name=octobot_windows_x64_hash::$(openssl sha256 ./bin/OctoBot_windows_x64.exe | awk '{print $2}')

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.AUTH_TOKEN }}
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          release_name: Release - ${{ steps.vars.outputs.tag }}
          owner: ${{ github.repository_owner }}
          repo: OctoBot
          draft: true
          prerelease: false
          commitish: master
          body: |
            | Binary        | Download link | SHA256        |
            | ------------- |:-------------:|:-------------:|
            | Windows x64 | [Download](https://github.com/${{ github.repository_owner }}/OctoBot/releases/download/${{ steps.vars.outputs.tag }}/OctoBot_windows_x64.exe) | ${{ steps.hashes.outputs.octobot_windows_x64_hash }} |
            | Linux x64 | [Download](https://github.com/${{ github.repository_owner }}/OctoBot/releases/download/${{ steps.vars.outputs.tag }}/OctoBot_linux_x64) | ${{ steps.hashes.outputs.octobot_linux_x64_hash }} |
            | Linux arm64 | [Download](https://github.com/${{ github.repository_owner }}/OctoBot/releases/download/${{ steps.vars.outputs.tag }}/OctoBot_linux_arm64) | ${{ steps.hashes.outputs.octobot_linux_arm64_hash }} |
            | MacOS arm64 | [Download](https://github.com/${{ github.repository_owner }}/OctoBot/releases/download/${{ steps.vars.outputs.tag }}/OctoBot_macos_arm64) | ${{ steps.hashes.outputs.octobot_macos_arm64_hash }} |

      - name: Upload Release Asset - OctoBot_windows_x64
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.AUTH_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bin/OctoBot_windows_x64.exe
          asset_name: OctoBot_windows_x64.exe
          asset_content_type: application/x-binary

      - name: Upload Release Asset - OctoBot_linux_x64
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.AUTH_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bin/OctoBot_linux_x64
          asset_name: OctoBot_linux_x64
          asset_content_type: application/x-binary

      - name: Upload Release Asset - OctoBot_linux_arm64
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.AUTH_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bin/OctoBot_linux_arm64
          asset_name: OctoBot_linux_arm64
          asset_content_type: application/x-binary

      - name: Upload Release Asset - OctoBot_macos_arm64
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.AUTH_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bin/OctoBot_macos_arm64
          asset_name: OctoBot_macos_arm64
          asset_content_type: application/x-binary

  notify:
    if: ${{ failure() }}
    needs:
      - build
      - tests
      - overlay
      - extended_linter
      - docker
      - binary
      - tentacles
      - release
      - version
      - docs
      - publish-npm
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Notify failure in Discord
        env:
          DISCORD_GITHUB_WEBHOOK: ${{ secrets.DISCORD_GITHUB_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_GITHUB_WEBHOOK" ]; then
            echo "::notice::Discord webhook is not configured; skipping failure notification."
            exit 0
          fi
          payload="{\"content\":\"OctoBot CI failed: ${RUN_URL}\"}"
          curl --fail-with-body --silent --show-error --retry 3 \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$DISCORD_GITHUB_WEBHOOK"
