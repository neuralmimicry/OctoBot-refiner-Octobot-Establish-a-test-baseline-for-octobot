policy_version: 2

git_rules:
  - rule_id: git.merge_base_missing
    hint: Fetch origin / fix branch name

path_rules:
  - rule_id: path.deny_repo_tentacles
    kind: repo_root_tentacles
    hint: Edit packages/tentacles/; run reinstall-tentacles.sh; never commit install output
  - rule_id: path.deny_user
    globs:
      - "user/**"
      - "**/user/**"
    hint: User data is local; not for PRs
  - rule_id: path.deny_dotenv
    # Upstream's committed fixture contains placeholder exchange variables.
    # Actual .env files, other templates and user credentials remain denied.
    exclude_globs:
      - "additional_tests/exchanges_tests/.env.template"
    globs:
      - ".env"
      - ".env.*"
      - "**/.env"
      - "**/.env.*"
    hint: No env files in git
  - rule_id: path.deny_cursor_local
    globs:
      - ".cursor/venv/**"
      - ".cursor/env.sh"
      - ".cursor/pythonpath.sh"
    hint: Generated/local; gitignored
  - rule_id: path.deny_private_keys
    globs:
      - "**/*.pem"
      - "**/*_rsa"
      - "**/*_dsa"
      - "**/id_rsa*"
    hint: No keys in repo
  - rule_id: path.deny_known_secret_filenames
    globs:
      - "**/credentials.json"
      - "**/secrets.json"
      - "**/*service-account*.json"
    hint: Use secrets manager / local only
  - rule_id: path.deny_agent_plans
    globs:
      - "**/PLAN-*.md"
      - "**/*.plan.md"
      - ".cursor/plans/**"
    hint: Agent/session plans are not product code; keep in Cursor Plan UI or chat; never commit
  - rule_id: path.deny_node_web_playwright_e2e
    globs:
      - "packages/tentacles/Services/Interfaces/node_web_interface/e2e/**"
    hint: Node UI — use Vitest (npm test) + Python/API tests; no Playwright e2e in repo; manual UI QA via agent-seed

agent_docs_rules:
  - rule_id: agent_docs.no_regression_vs_merge_base
    shrink_line_threshold: 5
    path_globs:
      - "**/AGENTS.md"
      - ".cursor/skills/**/SKILL.md"
      - ".cursor/README.md"
      - ".cursor/rules/**"
      - "CONTRIBUTING-agent.md"
      - "tools/**/README.md"
      - "tools/**/ARCHITECTURE.md"
    hint: Do not shrink or backdate agent docs unless this PR owns them; restore from origin/<base> or merge-base

diff_rules:
  - rule_id: diff.no_pip_install
    # These are declared build environments, policy documentation and negative
    # test fixtures. Runtime application code receives no exemption.
    exclude_globs:
      - ".cursor/cloud-install.sh"
      - ".cursor/rules/octobot-cloud.mdc"
      - ".cursor/skills/cloud-roadmap/SKILL.md"
      - ".cursor/skills/octobot-cloud/SKILL.md"
      - ".github/workflows/main.yml"
      - "tools/tests/extended_linter/**"
    patterns:
      - '\bpip3?\s+install\b'
      - '\buv\s+pip\s+install\b'
      - '\bpoetry\s+add\b'
      - '\bconda\s+install\b'
    hint: Add deps via requirements / BUILD; no install in code or scripts in PR
  - rule_id: diff.no_npm_install
    exclude_globs:
      - ".cursor/rules/octobot-cloud.mdc"
      - ".cursor/skills/cloud-roadmap/SKILL.md"
      - ".cursor/skills/octobot-cloud/SKILL.md"
      - "packages/protocol/AGENTS.md"
      - "packages/tentacles/Services/Interfaces/node_web_interface/README.md"
      - "tools/extended_linter/layers/diff_policy.py"
      - "tools/tests/extended_linter/**"
    patterns:
      - '\bnpm\s+install\b'
      - '\byarn\s+add\b'
      - '\bpnpm\s+add\b'
    hint: Use package.json / lockfile workflow
  - rule_id: diff.no_git_force_push
    exclude_globs:
      - "tools/tests/extended_linter/**"
    patterns:
      - 'push\s+--force'
      - 'push\s+-f\b'
    hint: No force-push in docs/scripts/commits
  - rule_id: diff.no_bare_except
    exclude_globs:
      - "tools/tests/extended_linter/**"
    patterns:
      - 'except\s*:'
    hint: Catch specific exceptions
  - rule_id: diff.no_subprocess_pip
    exclude_globs:
      - "tools/tests/extended_linter/**"
    kind: subprocess_package_manager
    hint: No runtime package installs
  - rule_id: diff.no_disable_verify
    exclude_globs:
      - "tools/extended_linter/config/policy.yaml"
      - "tools/tests/extended_linter/**"
    patterns:
      - '--no-verify'
      - '--no-gpg-sign'
    hint: Do not skip hooks in repo guidance
