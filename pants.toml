# Pants configuration for OctoBot
[GLOBAL]
pants_version = "2.30.0"
backend_packages = [
    "pants.backend.python",
    "pants.backend.docker",
    "pants.backend.shell",
    "python_plugins",
]
pants_ignore_use_gitignore = false
pants_ignore = ["venv/"]
pantsd = true
pantsd_max_memory_usage = "6GiB"
pythonpath = ["%(buildroot)s/pants-plugins"]

[source]
# Configure source roots for packages directory
# Each package folder is a source root (octobot_commons, octobot_trading, etc.)
# /packages for tentacles package which needs to be imported as 'tentacles.Evaluator.X'
# / - for root level sources like octobot
root_patterns = [
    "/packages/agents",
    "/packages/async_channel",
    "/packages/backtesting",
    "/packages/binary",
    "/packages/commons",
    "/packages/evaluators",
    "/packages/node",
    "/packages/flow",
    "/packages/copy",
    "/packages/protocol",
    "/packages/services",
    "/packages/sync",
    "/packages/tentacles_manager",
    "/packages/trading",
    "pants-plugins",
    "/",
]

[python]
# Python interpreter compatibility
interpreter_constraints = ["==3.13.*"]
enable_resolves = false

[python-bootstrap]
search_path = ["<PATH>", "<PYENV>"]

[subprocess-environment]
# actions/setup-python on self-hosted Linux runners installs a shared-library
# CPython build and exports LD_LIBRARY_PATH so libpython3.13.so can be found.
# Pants scrubs the environment of its sandboxed processes, which makes that
# interpreter look "broken" to Pex unless LD_LIBRARY_PATH is passed through.
env_vars.add = ["LD_LIBRARY_PATH"]

[python-infer]
# Shared requirements such as pydantic and numpy have multiple target owners.
# Choose the owner nearest each source root so Pants retains import inference
# without making package builds depend on ambiguous requirement targets.
imports = true
ambiguity_resolution = "by_source_root"
conftests = true

[docker]
use_buildx = true
default_repository = "drakkarsoftware/octobot"
build_verbose = true 
env_vars.add = [
  "DOCKER_BUILDKIT=1",
]
